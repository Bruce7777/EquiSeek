name: Deploy project website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "apps/desktop/assets/icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare static website
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp apps/desktop/assets/icon.png _site/assets/icon.png
          cp docs/images/research-assistant.png _site/assets/research-assistant.png
          cp docs/images/decision-journal.png _site/assets/decision-journal.png
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
