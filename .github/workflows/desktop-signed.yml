name: desktop-signed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.10.9"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --frozen --extra desktop-build --extra dev
      - run: npm ci --prefix apps/desktop
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -m "not integration" --cov --cov-report=term-missing
      - run: uv run python scripts/check_version_consistency.py
      - run: uv run python scripts/verify_readme_pair.py
      - run: uv run pip-audit
      - run: npm --prefix apps/desktop run lint
      - run: npm --prefix apps/desktop run typecheck
      - run: npm --prefix apps/desktop run test
      - run: npm --prefix apps/desktop audit --audit-level=high

  macos:
    name: Signed macOS ${{ matrix.arch }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    environment: desktop-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.10.9"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --frozen --extra desktop-build --extra dev
      - run: npm ci --prefix apps/desktop
      - name: Require release secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_KEYCHAIN_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER MACOS_APPLICATION_IDENTITY MACOS_INSTALLER_IDENTITY; do
            test -n "${!name}" || { echo "Missing required secret: $name" >&2; exit 1; }
          done
      - name: Import Apple signing identities
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/equiseek-signing.p12"
          keychain_path="$RUNNER_TEMP/equiseek-signing.keychain-db"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          echo "EQUISEEK_MACOS_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
      - run: npm --prefix apps/desktop audit --audit-level=high
      - run: uv run pip-audit
      - run: uv run pyinstaller --noconfirm --clean --distpath ../dist --workpath ../build EquiSeekSidecar.spec
        working-directory: packaging
      - run: dist/equiseek-sidecar --self-test
      - name: Build signed and notarized app, PKG, and ZIP
        env:
          EQUISEEK_SIGN_MACOS: "1"
          EQUISEEK_MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          EQUISEEK_MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm --prefix apps/desktop run make -- --arch=${{ matrix.arch }}
      - name: Notarize and staple PKG installer
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          while IFS= read -r -d '' package; do
            xcrun notarytool submit "$package" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$package"
            xcrun stapler validate "$package"
            pkgutil --check-signature "$package"
          done < <(find apps/desktop/out/make -type f -name '*.pkg' -print0)
      - name: Verify app signature and Gatekeeper assessment
        run: |
          app_path="$(find apps/desktop/out -maxdepth 2 -type d -name 'EquiSeek.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          find apps/desktop/out/make -type f -exec shasum -a 256 {} \; | sort > apps/desktop/out/make/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EquiSeek-macOS-${{ matrix.arch }}-signed
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          retention-days: 14
      - name: Delete temporary keychain and credentials
        if: always()
        run: |
          if test -n "${EQUISEEK_MACOS_KEYCHAIN:-}"; then security delete-keychain "$EQUISEEK_MACOS_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/equiseek-signing.p12" "$RUNNER_TEMP"/AuthKey_*.p8

  windows:
    name: Signed Windows x64
    needs: preflight
    runs-on: windows-2022
    environment: desktop-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.10.9"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --frozen --extra desktop-build --extra dev
      - run: npm ci --prefix apps/desktop
      - name: Materialize Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64) { throw "Missing WINDOWS_CERTIFICATE_PFX_BASE64" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Missing WINDOWS_CERTIFICATE_PASSWORD" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "equiseek-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          "EQUISEEK_WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm --prefix apps/desktop audit --audit-level=high
      - run: uv run pip-audit
      - run: uv run pyinstaller --noconfirm --clean --distpath ../dist --workpath ../build EquiSeekSidecar.spec
        working-directory: packaging
      - run: dist\equiseek-sidecar.exe --self-test
      - name: Build signed Squirrel installer
        env:
          EQUISEEK_SIGN_WINDOWS: "1"
          EQUISEEK_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm --prefix apps/desktop run make -- --arch=x64
      - name: Verify Authenticode and checksums
        shell: pwsh
        run: |
          $app = Get-ChildItem apps/desktop/out -Recurse -Filter EquiSeek.exe | Select-Object -First 1
          $setup = Get-ChildItem apps/desktop/out/make -Recurse -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $app -or -not $setup) { throw "Signed app or installer was not found" }
          foreach ($file in @($app, $setup)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($file.FullName) ($($signature.Status))" }
          }
          Get-ChildItem apps/desktop/out/make -Recurse -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.FullName.Substring((Resolve-Path apps/desktop/out/make).Path.Length + 1))"
          } | Sort-Object | Out-File apps/desktop/out/make/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EquiSeek-Windows-x64-signed
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          retention-days: 14
      - name: Delete temporary certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\equiseek-signing.pfx" -Force -ErrorAction SilentlyContinue
