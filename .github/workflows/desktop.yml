name: desktop

on:
  push:
    branches: [main, dev, "feature_*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            arch: arm64
            artifact: EquiSeek-macOS-arm64-unsigned
          - name: macOS Intel
            os: macos-15-intel
            arch: x64
            artifact: EquiSeek-macOS-x64-unsigned
          - name: Windows x64
            os: windows-2022
            arch: x64
            artifact: EquiSeek-Windows-x64-unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.10.9"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --frozen --extra desktop-build --extra dev
      - run: npm ci --prefix apps/desktop
      - run: uv run pytest -q tests/unit/test_sidecar_protocol.py tests/unit/test_sidecar_local_state.py tests/unit/test_sidecar_runs.py tests/unit/test_skill_workspace.py
      - run: npm --prefix apps/desktop run lint
      - run: npm --prefix apps/desktop run typecheck
      - run: npm --prefix apps/desktop run test
      - run: npm --prefix apps/desktop audit --audit-level=high
      - run: uv run pip-audit
      - run: uv run pyinstaller --noconfirm --clean --distpath ../dist --workpath ../build EquiSeekSidecar.spec
        working-directory: packaging
      - name: Verify frozen sidecar (macOS)
        if: runner.os == 'macOS'
        run: dist/equiseek-sidecar --self-test
      - name: Verify frozen sidecar (Windows)
        if: runner.os == 'Windows'
        run: dist\equiseek-sidecar.exe --self-test
      - run: npm --prefix apps/desktop run make -- --arch=${{ matrix.arch }}
      - name: Verify packaged sidecar (macOS)
        if: runner.os == 'macOS'
        run: find apps/desktop/out -path '*/Contents/Resources/equiseek-sidecar' -type f -exec {} --self-test \;
      - name: Verify packaged sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem apps/desktop/out -Recurse -Filter equiseek-sidecar.exe | Select-Object -First 1
          if (-not $sidecar) { throw "Packaged sidecar was not found" }
          & $sidecar.FullName --self-test
      - name: Verify embedded compliance bundle
        shell: bash
        run: |
          test -f build/release-compliance/LICENSE
          test -f build/release-compliance/THIRD_PARTY_LICENSE_INDEX.json
          test -f build/release-compliance/sbom-python.cdx.json
          test -f build/release-compliance/sbom-electron.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          retention-days: 7
